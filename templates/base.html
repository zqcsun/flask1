<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Flask Movies</title>

    <!-- ✅ Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ✅ Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-dark text-light">
    <!-- 🔹 Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark movie-navbar py-3 shadow-lg">
        <div class="container">
            <a class="navbar-brand fw-bold text-light" href="{{ url_for('index') }}">🎥 Flask Movies</a>
            <div>
                <a href="{{ url_for('index') }}" class="nav-link d-inline text-light px-2">Головна</a>
                <a href="{{ url_for('genres') }}" class="nav-link d-inline text-light px-2">Жанри</a>
                <a href="{{ url_for('add_movie') }}" class="nav-link d-inline text-light px-2">Додати</a>
                <a href="{{ url_for('about') }}" class="nav-link d-inline text-light px-2">Про сайт</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <!-- 🔹 Footer -->
    <footer class="text-center py-3 mt-4 border-top border-secondary">
        <p class="text-muted small mb-0">&copy; 2025 Flask Movies — створено з ❤️</p>
    </footer>
</body>
</html>
